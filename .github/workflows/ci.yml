name: CI & PR Benchmark Telemetry

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-benchmark:
    name: Build, Test & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute Target Base Branch Benchmark Baseline
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch origin "$BASE_REF" --depth=1 || true
          git checkout "origin/$BASE_REF" -- packages/ pnpm-lock.yaml package.json || true
          pnpm build || true
          node scripts/benchmark-bundle-size.js --save-baseline || true
          pnpm bench:json || true
          cp benchmarks/benchmark-report.json benchmarks/perf-baseline.json || true
          git checkout HEAD -- packages/ pnpm-lock.yaml package.json || true

      - name: Typecheck & Build Monorepo
        run: pnpm build

      - name: Lint Workspace
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

      - name: Run Unified Benchmark Suite & Generate JSON Report
        run: pnpm bench:json

      - name: Generate PR Markdown Report
        run: node scripts/generate-pr-comment.js

      - name: Post or Update PR Benchmark Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const commentBody = fs.readFileSync(path.resolve('benchmarks/pr-comment.md'), 'utf8');
            const header = '## 🚀 CI Benchmark & Bundle Size Telemetry';

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes(header)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
              console.log(`Updated existing PR benchmark comment ID: ${botComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
              console.log('Created new PR benchmark comment.');
            }
