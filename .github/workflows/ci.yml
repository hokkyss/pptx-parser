name: CI & PR Benchmark Telemetry

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-benchmark:
    name: Build, Test & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compute Target Base Branch Benchmark Baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          TARGET_REF="${BASE_REF:-main}"
          TARGET_DIR="/tmp/base-worktree"
          mkdir -p benchmarks
          git fetch origin "$TARGET_REF" --depth=1 || true
          git worktree add "$TARGET_DIR" "origin/$TARGET_REF" || true
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            pnpm install --no-frozen-lockfile --ignore-scripts || true
            pnpm build || true
            node scripts/benchmark-bundle-size.js --save-baseline || true
            pnpm bench:json || true
            if [ -f "benchmarks/bundle-baseline.json" ]; then
              cp benchmarks/bundle-baseline.json "$GITHUB_WORKSPACE/benchmarks/bundle-baseline.json" || true
            fi
            if [ -f "benchmarks/benchmark-report.json" ]; then
              cp benchmarks/benchmark-report.json "$GITHUB_WORKSPACE/benchmarks/perf-baseline.json" || true
            fi
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$TARGET_DIR" || rm -rf "$TARGET_DIR" || true
          fi

      - name: Typecheck & Build Monorepo
        run: pnpm build

      - name: Lint Workspace
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

      - name: Run Unified Benchmark Suite & Generate JSON Report
        run: pnpm bench:json

      - name: Generate PR Markdown Report
        run: node scripts/generate-pr-comment.js

      - name: Save PR Number Metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p benchmarks
          echo "$PR_NUMBER" > benchmarks/pr-number.txt

      - name: Upload PR Benchmark Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-benchmark-telemetry
          path: |
            benchmarks/pr-comment.md
            benchmarks/pr-number.txt
          retention-days: 1
