name: PR Benchmark Telemetry Commenter

on:
  workflow_run:
    workflows: ["CI & PR Benchmark Telemetry"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Post Benchmark Comment
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download Telemetry Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: pr-benchmark-telemetry
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or Update PR Benchmark Comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumberFile = path.resolve('pr-number.txt');
            const commentFile = path.resolve('pr-comment.md');

            if (!fs.existsSync(prNumberFile) || !fs.existsSync(commentFile)) {
              console.log('Artifact files missing; skipping comment.');
              return;
            }

            const prNumber = parseInt(fs.readFileSync(prNumberFile, 'utf8').trim(), 10);
            const commentBody = fs.readFileSync(commentFile, 'utf8');
            const header = '## 🚀 CI Benchmark & Bundle Size Telemetry';

            if (!prNumber || isNaN(prNumber)) {
              console.log('Invalid PR number:', prNumber);
              return;
            }

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes(header)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
              console.log(`Updated existing PR benchmark comment ID: ${botComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
              console.log(`Created new PR benchmark comment on PR #${prNumber}.`);
            }
