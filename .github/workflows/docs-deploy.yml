name: Deploy @monorepo/docs to Cloudflare

on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: docs-production
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create .env file
        working-directory: apps/docs
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_FILE" > .env
      
      - name: Build
        working-directory: apps/docs
        env:
          CLOUDFLARE: true
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CLOUDFLARE_ENV: production
        run: |
          pnpm --filter @monorepo/docs... run build

      - name: Deploy
        working-directory: apps/docs
        env:
          COMMIT_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:cloudflare "$COMMIT_SHA"

      - name: Purge Cloudflare Cache (production)
        if: ${{ github.ref_name == 'main' || github.event_name == 'release' || github.event_name == 'workflow_call' || github.ref_type == 'tag' }}
        uses: nathanvaughn/actions-cloudflare-purge@e893da8393033106c170b0b9de0918112cf04800 # v4.0.0
        with:
          cf_zone: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cf_auth: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Purge Cloudflare Cache (development)
        if: ${{ github.ref_name == 'dev' }}
        uses: nathanvaughn/actions-cloudflare-purge@e893da8393033106c170b0b9de0918112cf04800 # v4.0.0
        with:
          cf_zone: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cf_auth: ${{ secrets.CLOUDFLARE_API_TOKEN }}
