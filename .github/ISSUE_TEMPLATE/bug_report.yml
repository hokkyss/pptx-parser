name: 🐛 Bug Report
description: Report an issue, incorrect OpenXML parsing/serialization, or PowerPoint repair error.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package in the monorepo is experiencing this issue?
      options:
        - "@hokkyss/pptx (Fluent SDK)"
        - "@hokkyss/pptx-reader (Parser)"
        - "@hokkyss/pptx-writer (Serializer)"
        - "@hokkyss/pptx-core (AST & Units)"
        - "CLI / Repository Tooling"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime Environment
      description: What JavaScript/TypeScript runtime are you running on?
      options:
        - "Node.js (v18 / v20 / v22+)"
        - "Web Browser (Chrome / Safari / Firefox)"
        - "Cloudflare Workers"
        - "Deno"
        - "Bun"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code
      description: Please provide a minimal TypeScript code snippet demonstrating the bug.
      render: typescript
      placeholder: |
        import { Presentation, inches, points } from '@hokkyss/pptx';

        const pres = Presentation.create();
        const slide = pres.addSlide();
        // ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context / PowerPoint Error Message
      description: Attach any error stack traces, PowerPoint repair dialog warnings, or screenshots if applicable.
